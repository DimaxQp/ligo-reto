name: QA Web API Mobile
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 8 * * *' # 03:00 America/Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run typecheck
      - run: npm run test:dry-run
      - run: npx playwright install --with-deps chromium firefox
      - name: Web según evento
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:smoke
          elif [ "${{ github.event_name }}" = "push" ]; then
            npm test
          else
            npm run test:regression
          fi
      - name: Generar Allure aun si hay pruebas fallidas
        if: always()
        run: npm run allure:generate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-evidence
          path: web/evidence
          retention-days: 14
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: API según evento
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -B -ntp test -Dkarate.tags=@smoke
          else
            mvn -B -ntp test
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-evidence
          path: |
            api/target/karate-reports
            api/target/surefire-reports
          retention-days: 14

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      APPIUM_HOME: ${{ github.workspace }}/.tools/appium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run driver:install
      - run: npm run app:download
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd mobile && bash scripts/ci.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-evidence
          path: mobile/evidence
          retention-days: 14
